[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ic2x"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pyicloud==2.6.5",   # pinned: reverse-engineered, can break on Apple changes
  "requests>=2.32",
  "pillow",
  "pillow-heif",
  "numpy",         # used directly by polish.py (adaptive local enhance)
  "imagehash",
  "tweepy>=4.14",
  "openai",
  "pyyaml",       # used by enhance.py subprocess (InstructIR model config)
  "python-dotenv",
  "rich>=13",
  # Alibaba Cloud VIAPI imageenhan — image super-resolution / color enhancement (AccessKey auth)
  "alibabacloud_imageenhan20190930",
  "alibabacloud_tea_openapi",
  "alibabacloud_tea_util",
]

[project.optional-dependencies]
# Test/dev tooling. Install with:  uv sync --extra dev   (or  pip install -e ".[dev]")
dev = ["pytest>=7"]

[project.scripts]
ic2x = "ic2x.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# `pythonpath = src` lets tests import `ic2x` without the sys.path boilerplate; the
# existing inserts are harmless and keep each file runnable standalone too.
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
