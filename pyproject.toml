[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ic2x"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pyicloud==2.6.5",   # pinned: reverse-engineered, can break on Apple changes
  "requests>=2.32",
  "pillow",
  "pillow-heif",
  "imagehash",
  "tweepy>=4.14",
  "openai",
  "pyyaml",       # used by enhance.py subprocess (InstructIR model config)
  "python-dotenv",
  "rich>=13",
]

[project.scripts]
ic2x = "ic2x.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
